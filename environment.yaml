# Local (laptop) conda environment for the workflows documented in the
# README: data fetching (scripts/fetch_data.py), the local helper scripts
# under scripts/, and the tabular ML scripts. Direct dependencies only -
# conda resolves the rest from conda-forge.
#
# The Python dependencies for CI and uv-based development are tracked per
# workflow in pyproject.toml (dependency groups) and pinned in uv.lock;
# when adding a new import, update both that and this file. The cluster
# DFT environment is qe_environment.yaml; the GNN tutorial environment is
# basic_molecule_gnn/environment.yml.
name: pfas
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - pandas
  - requests
  - rdkit        # PFAS bucket flags in scripts/fetch_data.py
  - paramiko     # optional SFTP data source in scripts/fetch_data.py
  - scikit-learn
  - joblib       # model persistence in ml/fast_tree_based_training_demo.py
