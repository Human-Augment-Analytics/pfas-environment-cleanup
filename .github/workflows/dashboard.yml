name: Dashboard checks and Pages snapshot
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project web --locked
      - run: uv run --project web --locked pytest -c web/pyproject.toml web/tests -m 'not slow'
      - run: uv run --project web --locked ty check --project web
      - run: uv run --project web --locked ruff check web/dashboard web/tests dashboard.py
      - run: uv run --project web --locked ruff format --check web/dashboard web/tests dashboard.py
      - run: npm ci --prefix web/frontend
      - run: npm run format:check --prefix web/frontend
      - run: npm run build --prefix web/frontend
      - run: cp -r web/snapshot web/frontend/dist/snapshot
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/frontend/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
