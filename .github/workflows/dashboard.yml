name: Dashboard checks and Pages snapshot
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-default-groups --group web --group dev
      - run: uv run --locked --no-default-groups --group web --group dev pytest web/tests -m 'not slow'
      - run: uv run --locked --no-default-groups --group web --group dev ty check dashboard web/tests
      - run: uv run --locked --no-default-groups --group web --group dev ruff check dashboard web/tests
      - run: uv run --locked --no-default-groups --group web --group dev ruff format --check dashboard web/tests
      - run: npm ci --prefix web/frontend
      - run: npm run format:check --prefix web/frontend
      - run: PFAS_DATA_MODE=snapshot npm run build --prefix web/frontend
      - run: cp -r web/snapshot web/frontend/dist/snapshot
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/frontend/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
