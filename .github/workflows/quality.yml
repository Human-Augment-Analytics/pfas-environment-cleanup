name: Python quality checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Format, type check, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true
          cache-suffix: quality
      - name: Check formatting
        run: uv format --preview-features format-command --check -- scripts/dft_wrapper.py
      - name: Run type checks
        run: uv check --preview-features check-command --locked
      - name: Run fast tests
        run: uv run --locked --only-dev pytest -q -m 'not slow'
