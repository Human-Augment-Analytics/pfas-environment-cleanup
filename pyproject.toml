[project]
name = "pfas-materials-discovery"
version = "0.1.0"
description = "PFAS materials discovery workflows and Quantum ESPRESSO orchestration"
requires-python = ">=3.12,<3.13"

[dependency-groups]
data = [
    "pandas",
    "requests",
]

qe = [
    "ase",
    "cif2cell",
    "numpy",
    "openbabel-wheel",
    "pymatgen",
]

dev = [
    "pytest",
    "pytest-timeout",
    "ty",
]

[tool.uv]
# The installable src/pfas package will be introduced in a later migration.
package = false
required-version = ">=0.12.3"

[tool.ruff]
target-version = "py312"

[tool.ty.src]
# Begin with the dependency-free submission wrapper; expand this as the
# supported package structure is migrated.
include = ["scripts/dft_wrapper.py"]

[tool.pytest.ini_options]
timeout = 2
session_timeout = 60
markers = [
    "slow: test is excluded from the fast local and CI test suites",
]
