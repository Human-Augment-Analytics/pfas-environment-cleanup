[project]
name = "pfas-materials-discovery"
version = "0.1.0"
description = "PFAS materials discovery workflows and Quantum ESPRESSO orchestration"
requires-python = ">=3.12,<3.13"

[dependency-groups]
data = [
    "pandas",
    "requests",
]

qe = [
    "ase",
    "cif2cell",
    "numpy",
    "openbabel-wheel",
    "pymatgen",
]

dev = [
    "mypy",
    "pytest",
    "pytest-timeout",
    "ruff",
]

[tool.uv]
# The installable src/pfas package will be introduced in a later migration.
package = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Start with correctness checks while the existing scripts are being migrated.
select = ["E7", "E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
files = ["scripts/dft_wrapper.py"]
check_untyped_defs = true
warn_unused_configs = true

[tool.pytest.ini_options]
timeout = 2
session_timeout = 60
markers = [
    "slow: test is excluded from the fast local and CI test suites",
]
