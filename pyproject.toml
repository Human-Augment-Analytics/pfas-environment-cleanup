[project]
name = "pfas-materials-discovery"
version = "0.1.0"
description = "PFAS materials discovery workflows and Quantum ESPRESSO orchestration"
requires-python = ">=3.12,<3.13"
dependencies = [
    "visidata>=3.4",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-timeout",
    "ruff",
    "ty",
    "httpx",
]

web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "rdkit>=2024.9,<2027",
]

preparation = [
    { include-group = "chemistry" },
    { include-group = "qe" },
]

chemistry = [
    "paramiko",
    "rdkit",
]

qe = [
    "ase",
    "cif2cell",
    "numpy",
    "openbabel",
    "pymatgen",
]

data = [
    "pandas",
    "requests",
    "scikit-learn",
    "torch-geometric",
    "torch",
]

[tool.uv]
package = false
default-groups = "all"

[tool.ruff]
target-version = "py312"

[tool.ty.environment]
extra-paths = ["qespresso_pipeline"]

[tool.ty.src]
exclude = [
    "shivani_ml_models/gnn.py",
    "basic_molecule_gnn/basic_gnn_molecule.py",
]

[tool.pytest.ini_options]
testpaths = ["tests", "web/tests"]
timeout = 2
session_timeout = 60
markers = [
    "slow: test is excluded from the fast local and CI test suites",
]
